name: Bug Report
description: Report a bug or unexpected behavior in Monghoul
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the sections below so we can reproduce and fix the issue.

  - type: input
    id: version
    attributes:
      label: Monghoul version
      description: The status bar shows it at the bottom left of the window
      placeholder: e.g. 1.11.0
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux (.deb)
        - Linux (.rpm)
    validations:
      required: true

  - type: input
    id: os-version
    attributes:
      label: OS version
      placeholder: e.g. Windows 11 23H2, macOS 15.3, Ubuntu 24.04

  - type: dropdown
    id: area
    attributes:
      label: Feature area
      description: Which part of the app is affected?
      options:
        - Connections and security
        - Sidebar and navigation
        - Command palette
        - Query editor and environment
        - Schema-aware autocomplete
        - Aggregation builder
        - Result views
        - Document actions and result export
        - Charts and visualization
        - Tabs and workspace
        - Import and export
        - Schema analysis
        - Data generation
        - Index management
        - Validation rules
        - Cluster monitoring
        - Users and roles
        - Operation logs
        - Current operations
        - AI access
        - Themes and appearance
        - Interface and display
        - Keyboard shortcuts
        - Extended JSON and BSON
        - Database and collection operations
        - Licensing and trial
        - Updates, privacy and support
        - Write protection
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug description
      description: A clear and concise description of what the bug is
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Minimal steps to reproduce the behavior
      placeholder: |
        1. Open a connection to ...
        2. Navigate to ...
        3. Click on ...
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots / screen recordings
      description: If applicable, add screenshots or recordings to help explain the problem

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: |
        Any other context — e.g. MongoDB version, connection type (direct / replica set),
        execution mode (standard / fast), error messages from Operation Logs, etc.
