name: Feature Request
description: Suggest a new feature or improvement for Monghoul
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea for Monghoul? We'd love to hear it. Please describe the problem you're trying to solve — not just the solution.

  - type: dropdown
    id: area
    attributes:
      label: Feature area
      description: Which part of the app does this relate to?
      options:
        - Connections and security
        - Sidebar and navigation
        - Command palette
        - Query editor and environment
        - Schema-aware autocomplete
        - Aggregation builder
        - Result views
        - Document actions and result export
        - Charts and visualization
        - Tabs and workspace
        - Import and export
        - Schema analysis
        - Data generation
        - Index management
        - Validation rules
        - Cluster monitoring
        - Users and roles
        - Operation logs
        - Current operations
        - AI access
        - Themes and appearance
        - Interface and display
        - Keyboard shortcuts
        - Extended JSON and BSON
        - Database and collection operations
        - Licensing and trial
        - Updates, privacy and support
        - Write protection
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem or motivation
      description: What problem does this solve? Why do you need it?
      placeholder: I'm always frustrated when ...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How do you envision this working? Be as specific or as general as you like.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workarounds or alternative approaches you've thought of

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots / mockups
      description: If applicable, add visual references to help explain your idea

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Any other context — e.g. related features, links, use cases
